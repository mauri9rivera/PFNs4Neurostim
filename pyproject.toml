[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pfns4neurostim"
version = "0.1.0"
description = "Evaluating TabPFNs as drop-in replacements for GP-based Bayesian optimization in neurostimulation."
# The MAIN environment stays Python 3.9 (CLAUDE.md section 3, environment.yml); 3.10+ is only
# for the bench environment (environment.bench.yml), which hosts TabICL v2 / TabFM / TabFlex.
requires-python = ">=3.9"
readme = "README.md"
license = { file = "LICENSE" }

[project.optional-dependencies]
# Hyp 0 benchmark models (task #8). Each is optional because these backends are
# heavy and some conflict with the pinned Python 3.9 / torch 2.5.1 stack:
# tabpfn-v1 in particular cannot coexist with the tabpfn 6.3.2 used for v2.5,
# so it needs its own environment rather than a co-installed extra.
# TabFlex, TabICL and TabFM are vendored as git submodules under libs/, so these
# groups list only the dependencies those projects need but do not declare.
pfns4bo = ["pfns4bo==0.1.5"]
tabpfn-v1 = ["tabpfn<2"]                       # separate env: collides with tabpfn 6.3.2
mitra = ["autogluon.tabular>=1.4"]
tabflex = ["wandb", "mlflow", "interpret"]     # ticl imports these at module level
tabicl = ["einops", "huggingface-hub"]         # needs Python >= 3.10
tabfm = ["jax", "flax"]                        # needs Python >= 3.11

[tool.setuptools.packages.find]
where = ["src"]
# Restricted to the new package: the legacy flat tree (src/analysis, src/utils,
# src/models) must not be installed as top-level `analysis`/`utils`/`models`
# packages. Those stay importable in tests via the `pythonpath` setting below.
include = ["pfns4neurostim*"]

[tool.pytest.ini_options]
# `src/` is added to sys.path for the duration of the test session so both
# the new installable package (`pfns4neurostim`) and the legacy flat `src/`
# modules (`utils.*`, `models.*`, ...) are importable without an editable
# install. Existing tests additionally do their own `sys.path.insert` for
# the same directory (harmless duplicate) — see tests/test_data_utils_core.py.
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "slow: long-running test (> ~20 s); deselect with -m 'not slow'",
    "gpu: requires CUDA; skipped automatically when unavailable",
    "shadow: prototype tests that shadow future src/pfns4neurostim code",
    "legacy: tests covering src/pfns4neurostim/legacy_code (finetuning, LoRA, ...)",
]
