# Benchmark environment for the Hypothesis 0 external surrogates (Python 3.11).
#
# WHY A SECOND ENVIRONMENT (measured 2026-09-20, by reading each upstream project):
#
#   model      requires        can it run in the pinned py3.9 main env?
#   ---------  --------------  ----------------------------------------------
#   TabICL v2  Python >= 3.10  no
#   TabFM      Python >= 3.11  no
#   TabFlex    Python >= 3.8   dropped: its weight host no longer resolves (microsoft/ticl issue #27)
#   TabPFN v1  tabpfn < 2      no - collides with the pinned tabpfn 6.3.2 (own env, deferred)
#
# The external benchmark runs here and its cells are merged with the main run's through the shared cell cache.
# The package code is identical in both; only the interpreter and the library pins differ.
#
# Every version below is EXACTLY what was validated on 2026-09-20 (TabPFN-2.5, TabICL v2.2.0 and TabFM run end to end,
# `pip check` clean). The science stack is pip-only on purpose: mixing conda's numpy 1.26 build with pip packages that
# require numpy >= 2 (jax/flax, shap) produces a broken ABI.
#
#   bash scripts/mila_setup.sh env bench          # creates pfns4neurostim-bench from this file + installs the package
#   bash scripts/mila_setup.sh submodules         # libs/tabicl and libs/tabfm are used from the submodules (no pip install)
#
# pfns4bo==0.1.5 is deliberately NOT installed here (it pins scikit-learn<1.2); PFNs4BO runs in the MAIN env (configs/experiment/hyp0_pfns4bo_*.yaml).
name: pfns4neurostim-bench
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu118
      - torch==2.5.1
      # --- science stack (validated pins) ---
      - numpy==2.2.6
      - scipy==1.17.1
      - pandas==2.3.3
      - scikit-learn==1.6.1
      - matplotlib==3.11.2
      - seaborn==0.13.2
      - statsmodels==0.15.0
      - pyyaml==6.0.3
      - tqdm==4.70.1
      - pytest==9.1.1
      # --- the project's own stack, so results are comparable ---
      - tabpfn==6.3.2
      - gpytorch==1.11
      - linear-operator==0.5.1
      - botorch==0.10.0
      - pyro-ppl==1.9.1
      # --- TabICL v2 (vendored at libs/tabicl @ v2.2.0; these are its deps) ---
      - einops==0.8.2
      - huggingface-hub==1.32.0
      - psutil==7.2.2   # TabICL memory estimate at inference; declared upstream but the submodule is used without pip deps
      # --- TabFM (vendored at libs/tabfm; TORCH backend on GPU; the jax/flax backend is not used or validated) ---
      - safetensors==0.8.0     # weight loading; not declared upstream (found 2026-09-20)
      - absl-py==2.5.0
      - jaxtyping==0.2.38
      - typeguard==2.13.3
      - jax==0.10.2
      - jaxlib==0.10.2
