# Cross-platform environment for PFNs4Neurostim (Windows dev + Mila Linux cluster).
#
# Curated on 2026-09-18: the previous file was a full `conda env export` from
# Windows and could never solve on Linux (it pinned vs2015_runtime, vc14,
# ucrt, win_inet_pton with exact builds). The verbatim Windows export is kept
# as `environment.windows-lock.yml` for provenance.
#
# Only direct dependencies are listed, with the versions recorded in
# CLAUDE.md section 3. Torch comes from the PyTorch cu118 wheel index, which
# publishes both linux-64 and win-64 wheels, so one file serves both machines.
#
#   conda env create -f environment.yml        # first time
#   conda env update -f environment.yml -n pfns4neurostim   # afterwards
#   pip install -e .                           # the pfns4neurostim package
name: pfns4neurostim
channels:
  - conda-forge
dependencies:
  - python=3.9
  - pip
  # --- scientific stack (versions per CLAUDE.md section 3) ---
  - numpy=1.26.4
  - scipy=1.13.1
  - pandas=2.3.3
  - scikit-learn=1.6.1
  - matplotlib=3.9.2
  - seaborn=0.13.2
  # statsmodels is required by the Hyp B mixed-model degradation analysis (S11).
  - statsmodels=0.14.*
  - pyyaml
  - tqdm
  - pytest
  - pip:
      # --- torch 2.5.1 + CUDA 11.8 ---
      - --extra-index-url https://download.pytorch.org/whl/cu118
      - torch==2.5.1
      - torchvision==0.20.1
      - torchaudio==2.5.1
      # --- GP surrogates ---
      - gpytorch==1.11
      - linear-operator==0.5.1
      - botorch==0.10.0
      - pyro-ppl==1.9.1
      # --- PFN surrogates ---
      - tabpfn==6.3.2
      - pfns4bo==0.1.5
      - einops==0.8.2
      - xarray==2024.7.0
