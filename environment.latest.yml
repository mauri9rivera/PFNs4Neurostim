# Environment for the newest Hypothesis 0 surrogates: TabPFN-3.5 and Causilo (Python 3.11).
#
# WHY A FOURTH ENVIRONMENT (read from upstream's PyPI metadata, 2026-10-03):
#
#   model        requires                                  can it run in an existing env?
#   -----------  ----------------------------------------  ---------------------------------------------
#   TabPFN-3.5   tabpfn >= 9 (9.1.0), Python >= 3.10       no - `tabpfn` is also the module that provides
#                                                          TabPFN-2.5 and is pinned to 6.3.2 in main/bench
#   Causilo      causilo >= 1.0 (1.0.3), torch >= 2.13,    no - bench pins torch 2.5.1 (cu118)
#                Python 3.10-3.14, scikit-learn >= 1.6
#
# Both fit one environment, so they share this one rather than getting two (user decision 2026-10-03).
# TabPFN-2.5 stays in main/bench with tabpfn 6.3.2: bumping it would change the headline arm.
#
# STATUS: UNBUILT AND UNVALIDATED. The lower bounds below are what upstream declares; nothing was installed
# when this file was written. After the first successful build, replace each `>=` with the exact version
# that `pip freeze` reports (the other environment files are exact pins) and record `pip check` here.
# `torch>=2.13` may need a CUDA wheel index that matches the cluster driver; check before building on Mila/Narval.
#
#   bash scripts/mila_setup.sh env latest              # creates pfns4neurostim-latest + installs the package
#   bash scripts/narval_setup.sh env latest            # same on Narval (virtualenv)
#   bash scripts/narval_setup.sh weights latest        # pre-download both checkpoints on a login node
#   conda activate pfns4neurostim-latest
#   python -m pfns4neurostim bo_benchmark --config configs/experiment/hyp0_pfn_bench_nhp.yaml --set models=[tabpfn_v3_5,causilo]
name: pfns4neurostim-latest
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - pip:
      - torch>=2.13
      # --- science stack (compatible with torch >= 2.13; pin after the first build) ---
      - numpy>=2.2
      - scipy>=1.13
      - pandas>=2.3
      - scikit-learn>=1.6.1
      - matplotlib>=3.9
      - seaborn>=0.13
      - statsmodels>=0.14
      - pyyaml>=6
      - tqdm
      - pytest>=8
      # --- the project's own GP stack, so the GP arms are unchanged ---
      - gpytorch==1.11
      - linear-operator==0.5.1
      - botorch==0.10.0
      - pyro-ppl==1.9.1
      # --- the two models this environment exists for ---
      - tabpfn>=9.1,<10
      - causilo>=1.0.3
      - huggingface-hub
