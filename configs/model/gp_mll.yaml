# MLL-tuned exact GP (RBF): hyperparameters refit by marginal likelihood at every
# BO step. The primary comparator for every Hyp A and Hyp B claim (roadmap S8).
#
# P0.10, settled 2026-09-30: this is now a CONVERGED type-II ML fit. The previous arm (100 Adam steps at
# lr 0.1, float32) was unconverged in 90/90 NHP cells and the choice of optimiser moved cumulative regret
# by 13%, so the comparator has to be the converged one. L-BFGS with a strong-Wolfe line search, float64,
# 5 starts with the best marginal likelihood among the USABLE ones, and a noise-variance floor of 1e-3
# (gpytorch's 1e-4 default is where a converged fit lands and where K + noise*I stops factorising: it
# killed 5/90 cells). No priors -- a prior-regularised "expert" GP is a separate, later arm.
name: gp_mll
params:
  device: null           # per-model override of the experiment `device`
  n_opt_steps: 50        # L-BFGS max_iter per start: an upper bound, not a step count
  lr: 1.0                # initial step size; the line search sets the accepted one
  noise_floor: 1.0e-3    # noise VARIANCE floor; dimensionless because the online scaler puts y in [0, 1]
  n_restarts: 5          # start 0 is gpytorch's own init; the rest are log-uniform draws
