# Google TabFM (vendored at libs/tabfm, torch backend). Point predictions only: sigma is the spread across
# n_estimators ensemble members (a proxy, must be >= 2). Needs Python >= 3.11 (bench env) and a GPU: on CPU one
# 96-site predict took ~340 s (bfloat16 compute). Runs as the LAST PFN job of the D3 benchmark.
name: tabfm
params:
  device: null   # per-model override of the experiment `device`
  n_estimators: 4
