# Canonical hyperparameters for NHP LoRA vs Full FT ablation.
# Family: lora-ablation
# Tests whether LoRA (decoder_dict only, rank=8) matches full finetuning quality
# at a fraction of the trainable parameters.
# Usage:
#   python src/finetuning.py --config configs/nhp_lora_ablation.yaml

family: lora-ablation
dataset: nhp
split: inter_subject
mode:
  - optimization

# Training
epochs: 100
lr: 1.0e-4
aug_pct: 1.0

# LoRA settings
lora: true
lora_rank: 8
lora_alpha: 16
lora_target: decoder_dict

# Evaluation
budget: 100
n_reps: 30

# UCB kappa control:
#   kappa_schedule: 0.0  →  auto cosine-annealed schedule (GP-UCB theory)
#   kappa_schedule: 2.5  →  fixed kappa=2.5 throughout (no annealing)
kappa_schedule: 4.0

# Acquisition function
acq_fn: ucb
ts_temperature: 1.0

# Infrastructure
device: cuda
save: true
diagnostics: true
