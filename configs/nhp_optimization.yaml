# Canonical hyperparameters for NHP inter-subject optimization experiment.
# Family: optimization
# Usage:
#   python src/finetuning.py --config configs/nhp_optimization.yaml
#   python src/finetuning.py --config configs/nhp_optimization.yaml --epochs 100

family: optimization
dataset: nhp
split: inter_subject
mode:
  - optimization

# Training
epochs: 100
lr: 1.0e-4
aug_pct: 1.0

# Evaluation
budget: 100
n_reps: 30

# UCB Kappa Schedule
kappa_schedule: 4.0

# Acquisition function
acq_fn: ucb
ts_temperature: 1.0

# Infrastructure
device: cuda
save: true
diagnostics: true
