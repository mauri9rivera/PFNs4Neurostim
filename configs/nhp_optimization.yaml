# Canonical hyperparameters for NHP inter-subject optimization experiment.
# Family: optimization
# Usage:
#   python src/finetuning.py --config configs/nhp_optimization.yaml
#   python src/finetuning.py --config configs/nhp_optimization.yaml --epochs 100

family: optimization
dataset: nhp
split: inter_subject
mode:
  - optimization

# Training
epochs: 100
lr: 1.0e-4
aug_pct: 1.0

# Finetuning objective (uncomment to override TabPFN defaults of
# crps_loss_weight=1.0 + mse_loss_weight=1.0). Each key maps to a weighted term
# in TabPFN's regression loss; leave commented to keep the default CRPS+MSE blend.
#   pure CRPS:  crps_loss_weight: 1.0  /  mse_loss_weight: 0.0
#   pure NLL:   ce_loss_weight: 1.0  /  crps_loss_weight: 0.0  /  mse_loss_weight: 0.0
# ce_loss_weight: 0.0
# crps_loss_weight: 1.0
# crls_loss_weight: 0.0
# mse_loss_weight: 1.0
# mae_loss_weight: 0.0

# Evaluation
budget: 100
n_reps: 30

# UCB Kappa Schedule
kappa_schedule: 4.0

# Acquisition function (TS is the project default; kappa_* only apply when acq_fn: ucb)
acq_fn: ts
ts_temperature: 1.0

# Infrastructure
device: cuda
save: true
diagnostics: true
