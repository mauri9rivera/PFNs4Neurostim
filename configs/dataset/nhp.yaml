# NHP (macaque/cebus M1) cortical stimulation dataset.
# Subjects: 0 Cebus1, 1 Cebus2, 2 Macaque1, 3 Macaque2.
# No train/held-out split any more (2026-09-20): every valid subject is evaluated. Subject 2
# (Macaque1) was excluded as a "pure-noise signal" without a pre-declared threshold; restored
# 2026-10-09 (roadmap DS1). No channel-exclusion rule applies to it: the user dropped the planned
# reliability / SNR filter on 2026-10-15, so subject 2 enters with every channel.
name: nhp
subjects: [0, 1, 2, 3]
emgs: all            # 'all' or an explicit list, e.g. [0, 1, 2]
data_root: ./data    # cluster jobs override with $SLURM_TMPDIR/data
normalization: pfn   # data/preprocessing.py NORMALIZATIONS; pfn = MinMax X, z-scored y
