# Hypothesis B - K2 SNR, NHP, ladder expressed in dB of degradation.
#
# Identical to stress_k2_nhp.yaml except that the ladder is specified as target
# SNR degradations rather than raw alpha values. For K2 the mapping is analytic
# (alpha -> -20*log10(alpha) dB), so the solved levels are exact; the value of
# this form is that the same config produces the same *severity* on NHP, spinal
# and 5d_rat despite their different floor SNRs.
#
#   python -m pfns4neurostim stress_sweep --config configs/experiment/stress_k2_nhp_calibrated.yaml
defaults:
  dataset: nhp
  model: [tabpfn_v2_5, gp_mll, gp_naive]
  acquisition: ts_marginal   # headline (2026-09-20); EI/UCB compared in hyp0_acq_table_*

experiment: stress_sweep
family: stress-k2-calibrated
tag: nhp

knob:
  type: k2_snr
  targets_db: [0, -3, -6, -12]

budget: 96
n_init: 5
n_reps: 10
gt_mode: full_mean
device: cuda
seed: 42
output_root: output
equivalence_margin: 0.05

# GP models run on CPU: measured ~2.2x faster than CUDA for this Adam GP (P0.12); TabPFN stays
# on `device`. Regret is unaffected; latency is descriptive only (guardrail G1).
model_params:
  gp_mll: {device: cpu}
  gp_naive: {device: cpu}
