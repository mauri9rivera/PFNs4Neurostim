# Hypothesis 0 - acquisition table, NHP.
#
# Sweeps acquisition types across the model ladder. The table is deliberately
# ragged: ts_joint is a GP-only reference row (a PFN's query rows do not attend
# to each other), and the random-search baseline only serves random acquisition.
# Unsupported combinations are skipped with a logged note.
#
# UCB appears as the auto_dim schedule (`ucb`) plus the fixed-kappa grid
# (`ucb_k0.5` ... `ucb_k5`, the legacy kappa-ablation grid), so "vanilla TabPFN" can be
# settled on evidence.
#
# PRE-REGISTERED DECISION RULE (fixed before any run): the headline acquisition is the one
# with the lowest median RECOMMENDED regret on the TRAIN subjects (NHP: 0 and 3;
# 5d_rat: see hyp0_acq_table_5d_rat.yaml), ties broken by cumulative regret. Held-out
# subjects are never inspected for this choice (H0-5). If nothing beats gp_mll, report the
# best fixed kappa and say so plainly.
#
# Selection run (TRAIN subjects; the dataset default is the single held-out subject):
#   python -m pfns4neurostim bo_benchmark --config configs/experiment/hyp0_acq_table_nhp.yaml --set dataset.subjects=[0,3] n_reps=5
# GP timed on CPU while TabPFN runs on CUDA (P0.12; descriptive only, see guardrail G1):
#   ... --set model_params.gp_mll.device=cpu model_params.gp_naive.device=cpu
defaults:
  dataset: nhp
  model: [tabpfn_v2_5, gp_mll, gp_naive, random]
  acquisition: [ei, ucb, ucb_k0.5, ucb_k1, ucb_k2, ucb_k3, ucb_k5, ts_marginal, ts_joint, greedy, random]

experiment: bo_benchmark
family: hyp0-acq
tag: nhp

budget: 96
n_init: 5
n_reps: 15
gt_mode: full_mean
device: cuda
seed: 42
output_root: output
equivalence_margin: 0.05
