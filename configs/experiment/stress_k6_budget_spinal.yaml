# Hyp B K6 budget, spinal (Demo 2); ladder ends at the full 64-site grid.
#
# Derived from the NHP config of the same name (2026-09-25); differences: dataset/tag spinal, budget 64
# = the 8x8 grid (legacy spinal benchmark; NHP also uses budget = grid), subject 5 excluded (below).
defaults:
  dataset: spinal
  model: [tabpfn_v2_5, gp_mll, gp_naive]
  acquisition: ts_marginal   # headline (2026-09-20); EI/UCB compared in hyp0_acq_table_*

experiment: stress_sweep
family: stress-k6-budget
tag: spinal

dataset:
  # subject 5 excluded: one trial per site on all its EMGs, so no noise floor -> no achieved SNR,
  # no K2/K5 noise scale, no Demo 1 SNR match (it stays in the Hyp A / Hyp 0 benchmarks).
  subjects: [0, 1, 2, 3, 4, 6, 7, 8, 9, 10]

knob:
  type: k6_budget
  levels: [10, 20, 30, 50, 64]

budget: 64          # overridden per level by the knob
n_init: 5
n_reps: 10
gt_mode: full_mean     # or split_half (task #7): rep i runs on cross-fitted instance i mod 2*gt_n_splits
gt_n_splits: 10
device: cuda
seed: 42
output_root: output
equivalence_margin: 0.05

# GP models run on CPU: measured ~2.2x faster than CUDA for this Adam GP (P0.12); TabPFN stays
# on `device`. Regret is unaffected; latency is descriptive only (guardrail G1).
model_params:
  gp_mll: {device: cpu}
  gp_naive: {device: cpu}
