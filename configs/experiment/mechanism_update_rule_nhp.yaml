# Task #9 - update-rule alignment + implicit kernel (roadmap M10), the primary Hyp C analysis.
#
# Grid: channel x K2 level x context size t x context draw; engines share one context, one
# stratified anchor set (12) and one frozen MLL-GP reference per cell. Validation gates
# (positive control on a known GP, coordinate-shuffle negative control, x10-seed floor,
# linear-regime check) are written to gates.json; per research_design no real-data figure is
# interpreted unless they pass.
#
#   python -m pfns4neurostim mechanism --config configs/experiment/mechanism_update_rule_nhp.yaml
defaults:
  dataset: nhp

analysis: update_rule
tag: nhp
device: cuda
seed: 42
output_root: output

update_rule:
  engines: [tabpfn_v2_5, gp_mll_frozen, gp_mll_refit]
  context_sizes: [10, 25, 50]
  stress: {knob: k2_channel, levels: [1.0, 2.0, 4.0]}
  n_context_draws: 3
  n_anchors: 12
  surprises: [-3.0, -2.0, -1.0, -0.5, 0.5, 1.0, 2.0, 3.0]
  refit_surprises: [-1.0, -0.5, 0.5, 1.0]
  # Converged GP reference (2026-09-30, option A): these are the settings `gp_mll` itself now uses, so the
  # GP this analysis measures TabPFN against is the SAME GP the rest of the paper compares against. The
  # engines build GPSurrogate(**gp_params) directly, so they do not inherit the model group -- the settings
  # have to be restated here, and they must be kept in step with configs/model/gp_mll.yaml by hand.
  # NOTE the engines pass no `device`, so the GP arms run on CPU whatever `device` says above.
  # lengthscale_floor (2026-10-01): MECHANISM ONLY -- the BO experiments leave it at 0.0, so no cached cell
  # moves. Converged type-II ML on a 10-50 point context sometimes drives one ARD lengthscale to ~0, which
  # switches that axis off entirely; the closed-form conditioning these analyses use then builds a kernel
  # whose entries are wrong (catastrophic cancellation once 1/ell reaches ~1e8) and the analysis dies. Every
  # sound fit measured on these contexts had a minimum lengthscale >= 7.1e-2, the two pathological ones were
  # 2.7e-3 and 1.2e-4, and the floor of 0.05 is half the finest grid step (0.111 on NHP), so it binds on the
  # degenerate fits and nothing else -- at no cost in marginal likelihood (-2.189 either way, measured).
  gp_params: {n_opt_steps: 50, lr: 1.0, optimizer: lbfgs, dtype: float64, noise_floor: 1.0e-3, n_restarts: 5, lengthscale_floor: 0.05}
  # reference_gp (2026-10-02): the GP every update is measured against. `mll` = the converged type-II ML GP above; `fixed` = the
  # GP-fixed arm of the paper (no fitting, fixed_gp_params). The converged fit can drive one ARD lengthscale to ~0 and another to
  # ~1e4 on a 10-point context, so its update is a one-column stripe; `fixed` is an isotropic blob. Engines may add
  # `gp_fixed_frozen` to show that arm next to the others (identical to the reference when reference_gp is fixed).
  reference_gp: mll
  # Keep in step with configs/model/gp_naive.yaml by hand.
  fixed_gp_params: {lengthscale: 0.6931471805599453, outputscale: 1.0, noise: 0.05}
  inference_seed: 0
  gates: {positive_r: 0.7, lengthscale_tol: 0.25, icc_min: 0.75, linear_regime_tol: 0.25, null_quantile: 0.95, context_t: 25}
  positive_control: {grid_side: 10, lengthscale: 0.2, noise_sd: 0.3, n_trials: 10}
  seed_floor: {n_seeds: 10, n_channels: 2}
  link: {tidy_csv: null, model: tabpfn_v2_5, outcomes: [recommended_regret, cumulative_regret], predictors: [saturation_index_median, ell_adaptivity, rho_shape_median], n_boot: 2000}
  # context_ts (2026-09-30): the layer arm and figure F1 now sweep the same three context sizes as the
  # main grid -- 10 / 25 / 50 of the budget-96 NHP run (n_init 5) = early / quarter / half way. gates
  # .context_t = 25 stays inside the list, so the validation gates describe an operating point both
  # figures actually show. Cost is linear in the number of entries for the layer arm; F1 is free (the
  # arrays are already computed for every cell of the grid).
  layer_arm: {enabled: true, context_ts: [10, 25, 50], level: 1.0, ridge: 1.0}
  # Figure F1 (exemplar delta-maps). Every field is explicit and written into update_rule_exemplar.npz, so
  # the panel can be captioned and reproduced; see UPDATE_RULE_DEFAULTS for why each value was chosen.
  # select: median_alignment picks the channel at the MEDIAN rho_shape_offanchor -- representative rather
  # than a best case, which is what makes the "TabPFN updates like a GP" reading defensible.
  # One COLUMN PER CONTEXT SIZE, one channel: the channel is selected once (median rho_shape_offanchor
  # across these contexts), so the columns differ only in how much evidence the surrogate was given.
  exemplar: {context_ts: [10, 25, 50], level: 1.0, draw: 0, anchor_stratum: centre,
             select: median_alignment, subject: null, emg: null}
