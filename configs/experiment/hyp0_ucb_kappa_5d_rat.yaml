# UCB kappa sensitivity for TabPFN-2.5 on 5d_rat: the fixed-kappa grid (0.5, 1, 2, 3, 5) that the `ucb` (auto_dim schedule) row
# of hyp0_acq_core_5d_rat.yaml is compared against. Mirror of hyp0_ucb_kappa_nhp.yaml at the 5d_rat budget. TabPFN only.
defaults:
  dataset: 5d_rat
  model: [tabpfn_v2_5]
  acquisition: [ucb_k0.5, ucb_k1, ucb_k2, ucb_k3, ucb_k5]

experiment: bo_benchmark
family: hyp0-ucb-kappa
tag: 5d_rat

budget: 100
n_init: 5
n_reps: 10
gt_mode: full_mean
device: cuda
seed: 42
output_root: output
equivalence_margin: 0.05
