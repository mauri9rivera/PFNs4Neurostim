# Hypothesis 0 - acquisition table, 5D rat.
#
# Sweeps acquisition types across the model ladder. The table is deliberately
# ragged: ts_joint is a GP-only reference row (a PFN's query rows do not attend
# to each other), and the random-search baseline only serves random acquisition.
# Unsupported combinations are skipped with a logged note.
#
# UCB appears as the auto_dim schedule (`ucb`) plus the fixed-kappa grid
# (`ucb_k0.5` ... `ucb_k5`, the legacy kappa-ablation grid), so "vanilla TabPFN" can be
# settled on evidence.
#
# PRE-REGISTERED DECISION RULE (fixed before any run): with no train/held-out split, the
# headline acquisition is the one with the lowest median RECOMMENDED regret over ALL subjects
# and channels of this dataset, ties broken by cumulative regret. Caveat: selecting on the
# data that is then reported makes the headline optimistic for the chosen acquisition, so the
# full acquisition table is always reported alongside it. If nothing beats gp_mll, report the
# best fixed kappa and say so plainly.
#
# GP models are pinned to CPU below (P0.12; guardrail G1: latency is descriptive only).
#   python -m pfns4neurostim bo_benchmark --config configs/experiment/hyp0_acq_table_5d_rat.yaml --set n_reps=5
defaults:
  dataset: 5d_rat
  model: [tabpfn_v2_5, gp_mll, gp_naive, random]
  acquisition: [ei, ucb, ucb_k0.5, ucb_k1, ucb_k2, ucb_k3, ucb_k5, ts_marginal, ts_joint, greedy, random]

experiment: bo_benchmark
family: hyp0-acq
tag: 5d_rat

budget: 100
n_init: 5
n_reps: 15
gt_mode: full_mean
device: cuda
seed: 42
output_root: output
equivalence_margin: 0.05

# GP models run on CPU: measured ~2.2x faster than CUDA for this Adam GP (P0.12); TabPFN stays
# on `device`. Regret is unaffected; latency is descriptive only (guardrail G1).
model_params:
  gp_mll: {device: cpu}
  gp_naive: {device: cpu}
