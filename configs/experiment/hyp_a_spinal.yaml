# Hyp A, spinal: TabPFN-2.5 vs GP-MLL (+ GP-fixed, Random), ts_marginal.
#
# Derived from the NHP config of the same name (2026-09-25); differences: dataset/tag spinal, budget 64
# = the 8x8 grid (legacy spinal benchmark; NHP also uses budget = grid).
defaults:
  dataset: spinal
  model: [tabpfn_v2_5, gp_mll, gp_naive, random]
  acquisition: [ts_marginal, random]

experiment: bo_benchmark
family: hyp-a
tag: spinal

budget: 64
n_init: 5
n_reps: 10
gt_mode: full_mean
device: cuda
seed: 42
output_root: output
equivalence_margin: 0.05

# GP models run on CPU: measured ~2.2x faster than CUDA for this Adam GP (P0.12); TabPFN stays
# on `device`. Regret is unaffected; latency is descriptive only (guardrail G1).
model_params:
  gp_mll: {device: cpu}
  gp_naive: {device: cpu}
