# REVISIT CONTEXTS (user, 2026-10-26): OMEGA Part A coherence on contexts that sample some electrodes AGAIN, as a BO loop
# does. The distinct-site contexts of every earlier OMEGA run never exercise that regime, which is where TabPFN's row order
# mattered (PFNRefitEngine docstring: up to 0.09 in the mean at a revisited site) and where the 'observed' anchor pool
# (a second trial at an observed site) is most natural. EXPLORATORY, NOT PRE-REGISTERED, NOT RUN YET.
#
# CONTEXT. bayes_update.revisits.fraction = 0.25: 25 % of the t rows are a further trial (a different valid trial) at an already
# sampled site, so t = 40 holds 30 distinct electrodes, 10 of them twice (analysis/context.context_for, n_revisits). The
# distinct sites are those of a context of that size and the revisited ones are drawn per grid, so channels stay paired.
# row_order = history: the rows are listed in one random order (as the observations arrive), the same for every engine of
# a cell; 'sorted' would keep repeats adjacent after their first trial. Both enter the cell identity; the distinct-site
# cells of the other configs are untouched (identity unchanged when fraction = 0 and row_order = sorted).
#
# ENGINES. TabPFN-2.5 (deployed refit), GP-MLL refit (8 restarts, as mechanism_bayes_update_nhp_gp8.yaml) and GP-fixed; Part A
# only (an empty level filter switches Part B off); no C1, no exemplar. Everything else is copied from the gp8 config:
# level 1, t [30, 40, 50, 60, 80], 22 NHP channels, 10 layouts, the same anchors and RQMC levels.
# Cost estimate (unmeasured): ~1,100 cells x ~27 min single-threaded = ~500 core-h, the three engines together.
#
#   python -m pfns4neurostim mechanism --config configs/experiment/mechanism_bayes_update_nhp_revisits.yaml --only-cached
defaults:
  dataset: nhp
  context: nhp

analysis: bayes_update
tag: nhp-revisits
device: cpu
seed: 42
output_root: output

dataset:
  subjects: [0, 1, 2, 3]

context:
  sizes: [30, 40, 50, 60, 80]

bayes_update:
  engines: [tabpfn_v2_5, gp_mll_refit, gp_fixed]
  references: []
  # Part A everywhere, Part B nowhere (an empty level filter matches no cell).
  coverage:
    tabpfn_v2_5:
      B: {levels: []}
    gp_mll_refit:
      B: {levels: []}
    gp_fixed:
      B: {levels: []}
  stress: {knob: k2_channel, levels: [1.0]}
  n_context_draws: 10
  anchors: {n_unobserved: 8, n_observed: 4}
  revisits: {fraction: 0.25, row_order: history}
  quadrature: {method: rqmc, K: 8, u_min: 1.0e-12, central_mass: 1.0, n_scrambles: 8}
  eps: 0.01
  y_grid: {points: 512, u_tail: 1.0e-4}
  shared: {n_trials: 8, ladder: [-3.0, -2.0, -1.0, -0.5, 0.5, 1.0, 2.0, 3.0], saturation_c: [1.0, 3.0],
           reference: gp_mll_refit}
  far_pitch: 4.0
  # Changes from mechanism_bayes_update_nhp.yaml: n_restarts 5 -> 8, 10 draws, and the revisits block above.
  gp_params: {n_opt_steps: 50, lr: 1.0, optimizer: lbfgs, dtype: float64, noise_floor: 1.0e-3, n_restarts: 8,
              lengthscale_floor: 0.05}
  exemplar: {enabled: false, engines: [tabpfn_v2_5, gp_mll_refit]}
  panel_ts: [50, 80]
  run: {gates: false, grid: true, discrepancy: false}
