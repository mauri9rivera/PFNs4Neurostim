# CKA (b): embedding placement of the feature-token mean (task #5, P0.5; B1, 2026-10-06), NHP.
#
# Places each channel's layer-wise feature-token-mean embedding between the on-grid prior bank (TabPFN v1 prior bag,
# the floor) and the noise bank (the ceiling), row by row with debiased CKA, at every context size of the shared
# ladder configs/context/nhp.yaml = [10, 25, 50, 80]. Reported statistic: the rank placement p_rank (2026-10-12);
# the ratio p stays on disk as the frozen reference. Figures cka_placement.svg and cka_placement_surface.svg.
#
# TRIMMED 2026-10-21 (BETA §7, D5): CKA (a) -- the feature tokens against K_X / K_GT / K_GT_linear / K_GP with a
# site-permutation null, its M0 controls, the per-token shadow readout and the K_GP ceiling -- is replaced by the
# `representation` analysis (configs/experiment/mechanism_representation_nhp.yaml). The analysis name `cka` is kept
# (D5), and so are `layers` and `inference_seed`: both enter every (b) cell identity, so the cells re-run on
# 2026-10-21 for the subject-2 backfill keep serving.
#
# Cells: one per (grid, t, draw) over the grid's FULL channel list, cached under output/cells/nhp/mechanism_cka/; the
# prior and noise banks are cached artifacts. Never split this unit by subject.
#
#   python -m pfns4neurostim mechanism --config configs/experiment/mechanism_cka_nhp.yaml
#   python -m pfns4neurostim mechanism --config configs/experiment/mechanism_cka_nhp.yaml --only-cached
#   python -m pfns4neurostim mechanism --config configs/experiment/mechanism_cka_nhp.yaml --replot
defaults:
  dataset: nhp
  context: nhp

analysis: cka
tag: nhp
device: cuda
seed: 42
output_root: output

cka:
  layers: null                 # all 18 blocks
  inference_seed: 0
  # Rescaled 2026-09-27 (t, bank_quantile, n_prior 100, n_noise 30, min_gap) and swept over the shared ladder since
  # 2026-09-30 (n_draws 5 pays for the context axis). Places the feature-token mean (mechanism.CKA_PLACEMENT_READOUT).
  placement: {enabled: true, n_prior: 100, n_prior_holdout: 30, n_noise: 30,
              n_draws: 5, min_gap: 0.02, bank_quantile: 0.10, n_dense: 1024, holdout_frac: 0.1,
              rmse_threshold: 0.5, prior_type: prior_bag}
