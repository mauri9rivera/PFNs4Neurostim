# Hypothesis B - K2-global SNR: one absolute noise level for every channel.
# Dataset: NHP (draws, in vivo). Models: TabPFN-2.5 vs GP-MLL vs GP-fixed.
#
# Knob:   y~[s,r] = y[s,r] + alpha * e,  e ~ N(0, 1), on every valid trial of every channel.
#         alpha is a noise SD in z-scored response units, identical across channels, so it is
#         NOT proportional to a channel's floor: clean channels lose more dB than noisy ones.
# x-axis: achieved SNR (dB), which reaches SNR < 0 dB at the upper levels (restructure 2026-09-23).
# Budget: total queries INCLUDING n_init (P0.3).
#
#   python -m pfns4neurostim stress_sweep --config configs/experiment/stress_k2_global_nhp.yaml
defaults:
  dataset: nhp
  model: [tabpfn_v2_5, gp_mll, gp_naive]
  acquisition: ts_marginal   # headline (2026-09-20); EI/UCB compared in hyp0_acq_table_*

experiment: stress_sweep
family: stress-k2-global
tag: nhp

knob:
  type: k2_global
  levels: [0.0, 0.25, 0.5, 0.75, 1.0, 1.5, 2.0, 3.0]   # added noise SD (z-scored units)

budget: 96
n_init: 5
n_reps: 20                 # raised 10 -> 20 on 2026-09-30: with the causal (online) y scaler the early
                           # steps of a run are genuinely harder, so per-cell variance is higher and 10
                           # repetitions no longer represent a surrogate's reconstruction performance.
                           # n_reps is NOT part of cell identity (the rep index is), so raising it is
                           # additive: reps 0-9 are served from cache and only 10-19 are computed.
gt_mode: full_mean     # or split_half (task #7): rep i runs on cross-fitted instance i mod 2*gt_n_splits
online_y_scaler: minmax   # CANONICAL 2026-09-30: causal y scaling, refit inside the BO loop from the
                          # observations so far (none | minmax | zscore). This is the deployment-honest
                          # setting; the offline `none` arm survives as the pre-09-30 NHP runs.
gt_n_splits: 10
device: cuda
seed: 42
output_root: output

# Pre-registered TOST/non-inferiority margin, in range-normalized regret units.
equivalence_margin: 0.05

# GP models run on CPU: measured ~2.2x faster than CUDA for this Adam GP (P0.12); TabPFN stays
# on `device`. Regret is unaffected; latency is descriptive only (guardrail G1).
model_params:
  gp_mll: {device: cpu}
  gp_naive: {device: cpu}
