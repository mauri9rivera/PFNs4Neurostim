# Canonical hyperparameters for 5d_rat inter-subject optimization experiment.
# Family: optimization
# Usage:
#   python src/finetuning.py --config configs/5d_rat_optimization.yaml

family: optimization
dataset: 5d_rat
split: inter_subject
mode:
  - optimization

# Training
epochs: 100
lr: 1.0e-4
aug_pct: 2.5
# 5D search space (PW, freq, duration, x_ch, y_ch) has no 2D electrode grid,
# so the 2D-only spatial flips (h_flip/v_flip/d_flip) are unavailable.
aug_transforms:
  - none
  - y_shift

# Evaluation
budget: 200
n_reps: 20

# UCB kappa control:
#   kappa_schedule: 0.0  →  auto cosine-annealed schedule (GP-UCB theory)
#   kappa_schedule: 2.5  →  fixed kappa=2.5 throughout (no annealing)
kappa_schedule: 0.0

# Acquisition function (TS is the project default; kappa_* only apply when acq_fn: ucb)
acq_fn: ts
ts_temperature: 1.0

# Infrastructure
device: cuda
save: true
diagnostics: true
