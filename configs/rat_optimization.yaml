# Canonical hyperparameters for rat inter-subject optimization experiment.
# Family: optimization
# Usage:
#   python src/finetuning.py --config configs/rat_optimization.yaml

family: optimization
dataset: rat
split: inter_subject
mode:
  - optimization

# Training
epochs: 100
lr: 1.0e-4
aug_pct: 2.5

# Evaluation — rat grid is 8x4=32 sites, so budget matches grid size
budget: 32
n_reps: 30

# UCB kappa control:
#   kappa_schedule: 0.0  →  auto cosine-annealed schedule (GP-UCB theory)
#   kappa_schedule: 2.5  →  fixed kappa=2.5 throughout (no annealing)
kappa_schedule: 0.0

# Acquisition function
acq_fn: ucb
ts_temperature: 1.0

# Infrastructure
device: cuda
save: true
diagnostics: true
