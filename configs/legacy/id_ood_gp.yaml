# Canonical config for ID/OOD analysis using the submodule GP-bag reference only.
# Family: gp
# Sampled from the libs/tabpfn-v1-prior submodule (prior_type='gp'); the internal
# gpytorch generator is retired (2026-06-08). Per Hyp B, Noise is the main-story
# anchor — gp_bag is used for the B9 expressiveness diagnosis.
# Usage:
#   python src/id_ood_analysis.py --config configs/id_ood_gp.yaml

family: gp
datasets:
  - rat
  - nhp

analyses:
  - entropy
  - mmd
  - mahalanobis

prior_source: gp_bag
device: cpu
n_synthetic: 500
n_context: 0.5
seed: 42
save: true
