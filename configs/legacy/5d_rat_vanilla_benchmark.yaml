# Canonical hyperparameters for 5d_rat vanilla TabPFN vs GP benchmark.
# Family: vanilla-benchmark
# Usage:
#   python src/vanilla_benchmark.py --config configs/5d_rat_vanilla_benchmark.yaml

family: vanilla-benchmark
dataset: 5d_rat
mode:
  - optimization
  - optimization_budget

# Evaluation
budget: 200
n_reps: 20
budgets:
  - 10
  - 50
  - 100
  - 200
  - 400

# UCB kappa control:
#   kappa_schedule: 0.0  →  auto cosine-annealed schedule (GP-UCB theory scaling)
#                           kappa_max = max(2.5 * sqrt(d * log(n_steps)), 3.0)
#                           kappa_min = 0.2 * sqrt(d * log(n_steps))
#   kappa_schedule: 2.5  →  fixed kappa=2.5 throughout (no annealing)
kappa_schedule: 4.0

# Acquisition function (TS is the project default; kappa_* only apply when acq_fn: ucb)
acq_fn: ts
ts_temperature: 1.0

# kappa values tested in kappa_search mode
kappa_values:
  - 0.5
  - 1.0
  - 2.0
  - 3.0
  - 5.0

# TOST equivalence margin (A6): null = auto-calibrate from GP variance on first run.
tost_margin: null

# Infrastructure
device: cuda
save: true
seed: 42
