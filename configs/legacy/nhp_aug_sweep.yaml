# Canonical hyperparameters for NHP augmentation sensitivity sweep.
# Family: aug-sweep-opt
# Tests whether R2 and regret plateau after aug_pct ~ 2.5 (25 maps/EMG).
# Usage:
#   python src/finetuning.py --config configs/nhp_aug_sweep.yaml

family: aug-sweep-opt
dataset: nhp
split: inter_subject
mode:
  - aug_sweep_optimization

# Training — epochs/lr fixed; aug_pct is swept via aug_pct_sweep
epochs: 100
lr: 1.0e-4
aug_pct: 2.5

# Augmentation sweep values (0 = vanilla TabPFN baseline included automatically)
aug_pct_sweep:
  - 0.1
  - 0.2
  - 0.5
  - 0.7
  - 1.0
  - 2.5

# Evaluation
budget: 100
n_reps: 30

# UCB kappa control:
#   kappa_schedule: 0.0  →  auto cosine-annealed schedule (GP-UCB theory)
#   kappa_schedule: 2.5  →  fixed kappa=2.5 throughout (no annealing)
kappa_schedule: 4.0

# Acquisition function
acq_fn: ucb
ts_temperature: 1.0

# Finetuning objective (uncomment to override TabPFN defaults of
# crps_loss_weight=1.0 + mse_loss_weight=1.0). Each key maps to a weighted term
# in TabPFN's regression loss; leave commented to keep the default CRPS+MSE blend.
#   pure CRPS:  crps_loss_weight: 1.0  /  mse_loss_weight: 0.0
#   pure NLL:   ce_loss_weight: 1.0  /  crps_loss_weight: 0.0  /  mse_loss_weight: 0.0
# ce_loss_weight: 0.0
# crps_loss_weight: 1.0
# crls_loss_weight: 0.0
# mse_loss_weight: 1.0
# mae_loss_weight: 0.0

# Infrastructure
subjects: all
device: cuda
save: true
diagnostics: true
