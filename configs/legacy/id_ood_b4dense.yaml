# B4dense — Dense Layer-wise CKA (10-layer sweep: 0 2 4 6 8 10 12 14 16 17)
# GPU job: embedding cost ~3x vs B4 due to 10-layer hook extraction.
# Usage:
#   JOB=B4dense sbatch --gres=gpu:rtx8000:1 --cpus-per-task=4 --mem-per-gpu=24G --time=6:00:00 scripts/run_all_experiments.sh

family: id-ood-b4dense

analyses:
  - cka

cka_layers:
  - 0
  - 2
  - 4
  - 6
  - 8
  - 10
  - 12
  - 14
  - 16
  - 17

prior_source: tabpfn_prior
device: cuda
n_synthetic: 500
n_context: 0.5
seed: 42
save: true
